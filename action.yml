name: manifest-check
description: Audit an Android manifest (debuggable, cleartext, exported components, permissions) before Play does.
branding:
  icon: file-text
  color: green

inputs:
  path:
    description: Path to the .aab or AndroidManifest.xml.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        npm install --prefix "${{ github.action_path }}" --no-audit --no-fund --silent
        node "${{ github.action_path }}/bin/manifest-check.mjs" ${{ inputs.path }}
